services:
  - type: web
    name: 876-api
    runtime: node
    rootDir: apps/api
    # Prisma's client must be generated before the bundle is built; `migrate
    # deploy` is deliberately not here, because a build step is the wrong place
    # to change a schema every replica shares.
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_JWKS_URL
        sync: false
      - key: API_INTERNAL_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
      - key: POSTHOG_PROJECT_ID
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
