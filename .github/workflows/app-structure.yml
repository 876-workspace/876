name: App structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-structure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Reject AI commit attribution
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi

          node scripts/check-ai-attribution.mjs "$range"

      - run: pnpm install --frozen-lockfile

      # The structural invariants ESLint cannot express — notably the
      # sideways-import test, which compares the importing file's path against
      # the owning route's path. See .claude/rules/app-structure.md.
      - name: Structural invariants
        run: pnpm check:structure

      # Every bundled Express service must inline its @876/* workspace deps into
      # the container bundle. These packages ship raw TypeScript, so an
      # un-inlined import builds green but crashes the container at boot with
      # ERR_MODULE_NOT_FOUND (this is how PR #274 took the deployed API down).
      - name: Service bundle inlining
        run: pnpm check:service-bundle

      # `pnpm check` reaches this task through Turbo locally. Run the service's
      # own command here as well so an API-only pull request cannot bypass the
      # dependency-cruiser module and Prisma boundaries.
      - name: Module boundaries (couriers API)
        run: pnpm --filter @876/couriers-api boundaries

      # The boundary rules that ESLint can express, for the apps that import
      # eslint.app-structure.mjs.
      - name: Boundary lint (console)
        run: pnpm --filter @876/console lint

      - name: Boundary lint (billing)
        run: pnpm --filter @876/billing-app lint

      - name: Boundary lint (couriers)
        run: pnpm --filter @876/couriers-app lint

      - name: Boundary lint (876)
        run: pnpm --filter @876/app lint

      - name: Boundary lint (enterprise)
        run: pnpm --filter @876/enterprise lint
