name: Deploy to Cloudflare

# Continuous deployment for the 876 monorepo.
#
# Next.js apps ship as OpenNext Workers; the FastAPI services ship as
# Cloudflare Containers. Pushes are path-filtered to the migration of every app
# that owns a datastore; manual dispatches can target one app or the full
# deployment graph.
#
# Who owns a push deployment is a switch: the `DEPLOY_FROM_ACTIONS` repository
# variable. Exactly one deployer must be active, or two builds race onto the
# same Worker script.
#
#   unset / not "true"  — Cloudflare Workers Builds (the git integration) owns
#     every push deployment, including Container images. This workflow applies
#     datastore migrations on matching pushes and keeps deploys as a manual
#     `workflow_dispatch` fallback.
#
#   "true"  — this workflow owns push deployments too. Set it ONLY after
#     disconnecting the repo from Workers Builds in the Cloudflare dashboard
#     (Workers & Pages → the Worker → Settings → Builds), otherwise every
#     Worker deploys twice. Prefer this: a Workers Builds run that fails or
#     never triggers reports nothing anywhere, so main can sit undeployed for
#     hours with every check green — which is exactly what happened to
#     876-console on 2026-08-03 (PR #170 merged 14:03, last deploy 13:26).
#
# Migrations always run on push, under either owner: whoever ships the code
# does so regardless, so a dispatch-only migration would leave the schema
# behind the code and every write against a changed table would fail.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit (+ Containers)
#   CLOUDFLARE_ACCOUNT_ID
# Plus the per-app NEXT_PUBLIC_* build-time values listed in each job.
# Runtime secrets are NOT set here — they live in `wrangler secret put`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: 'Deploy a single app (or "all")'
        required: true
        default: all
        type: choice
        options:
          - all
          - widgets-api
          - api
          - couriers-api
          - billing-api
          - storage-api
          - console
          - billing
          - invoice
          - couriers
          - enterprise
          - app

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      widgets-api: ${{ steps.filter.outputs.widgets-api }}
      api: ${{ steps.filter.outputs.api }}
      couriers-api: ${{ steps.filter.outputs.couriers-api }}
      billing-api: ${{ steps.filter.outputs.billing-api }}
      storage-api: ${{ steps.filter.outputs.storage-api }}
      console: ${{ steps.filter.outputs.console }}
      billing: ${{ steps.filter.outputs.billing }}
      invoice: ${{ steps.filter.outputs.invoice }}
      couriers: ${{ steps.filter.outputs.couriers }}
      enterprise: ${{ steps.filter.outputs.enterprise }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The filter diffs against the previous head, so the full history
          # has to be present.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Validate Cloudflare release contract
        run: node scripts/check-cloudflare-release-contract.mjs
      # An app deploys when its own directory changes OR when any workspace
      # package in its transitive dependency graph does. A blanket
      # `packages/**` filter cannot express that: it either redeploys all
      # eleven Workers for one shared edit, or — if dropped — lets a fix in
      # `@876/ui` merge green while every app keeps serving the old bundle.
      - name: Resolve affected deploy targets
        id: filter
        run: node scripts/changed-deploy-targets.mjs "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.before || github.event.repository.default_branch }}
          HEAD: ${{ github.sha }}

  # ── Data plane ───────────────────────────────────────────────────────────
  # widgets-api deploys first: the UIs call it.

  widgets-api:
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.widgets-api == 'true') || inputs.app == 'all' || inputs.app == 'widgets-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm --filter @876/widgets-api exec prisma migrate deploy
        env:
          WIDGETS_DIRECT_DATABASE_URL: ${{ secrets.WIDGETS_DIRECT_DATABASE_URL }}
      - name: Sync runtime database secret
        working-directory: apps/widgets-api
        run: |
          printf '%s' "$WIDGETS_DATABASE_URL" |
            pnpm exec wrangler secret put WIDGETS_DATABASE_URL
        env:
          WIDGETS_DATABASE_URL: ${{ secrets.WIDGETS_DATABASE_URL }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-widgets-api
      - name: Deploy
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm --filter @876/widgets-api run deploy
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-widgets-api

  api:
    needs: changes
    # The job runs on any matching push, like every other service that owns a
    # datastore — only the deploy *step* is gated on who the deployer is. Gating
    # the whole job on DEPLOY_FROM_ACTIONS is how the migration step below
    # silently never ran: the job skipped, and the schema sat behind the code.
    if: (github.event_name == 'push' && needs.changes.outputs.api == 'true')
      || inputs.app == 'all' || inputs.app == 'api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Express service applies no DDL at boot, unlike the FastAPI service
      # it replaces, which rebuilt its schema from `ensure_*` functions on every
      # start. Migrations are applied here or they are not applied at all.
      # The identity database predates Prisma — the FastAPI service built it
      # from `ensure_*` functions, and the baseline migration only *describes*
      # that schema. Applying it would fail on `relation "addresses" already
      # exists`, which is what broke the first deploy. This resolves the
      # baseline once per environment and is a no-op afterwards.
      #
      # `API_DATABASE_URL`, not `DATABASE_URL`: every other service here names
      # its secret after itself, and the one unprefixed name is the one that
      # ended up holding a *courier* connection string — so this job spent a day
      # trying to build the identity schema inside the couriers database. A
      # prefixed name cannot be mistaken for "the database" in general. The step
      # still exports it as DATABASE_URL because that is what prisma.config.ts
      # reads.
      - name: Baseline the database
        run: pnpm --filter @876/api run db:baseline
        env:
          DIRECT_DATABASE_URL: ${{ secrets.API_DIRECT_DATABASE_URL }}
      - name: Apply migrations
        run: pnpm --filter @876/api exec prisma migrate deploy
        env:
          DIRECT_DATABASE_URL: ${{ secrets.API_DIRECT_DATABASE_URL }}
      # Gated on the same condition as the deploy below, and never run without
      # it. The API runs in a Container that copies the Worker's secrets into
      # its environment when the instance *starts*, so a secret written here
      # without the redeploy that follows would leave the API sealing cookies
      # with the old value while every app had already moved to the new one —
      # signing everybody out until the container happened to recycle.
      - name: Sync the shared session cookie secret
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/api
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      # apps/api's finance dispatcher calls 876-billing-api with this key; the
      # two Workers must hold the same value or every finance-connection ensure
      # is rejected 401 and 876 Invoice onboarding fails. Synced here, before
      # the container redeploy that copies it into the running instance's env.
      - name: Sync the shared billing internal key
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        uses: ./.github/actions/sync-worker-secret
        with:
          app-directory: apps/api
          secret-name: BILLING_INTERNAL_KEY
          secret: ${{ secrets.BILLING_INTERNAL_KEY }}
      - name: Sync runtime database secret
        working-directory: apps/api
        run: |
          printf '%s' "$DATABASE_URL" |
            pnpm exec wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-api
      # Containers build and push the Dockerfile image; the runner's Docker
      # daemon is used directly by wrangler. The build context is the repository
      # root (`image_build_context` in wrangler.jsonc), which is why this runs
      # from a full checkout rather than a sparse one.
      - name: Deploy container Worker
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        working-directory: apps/api
        run: pnpm exec wrangler deploy
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-api

  couriers-api:
    needs: changes
    # Runs on any matching push, like the api job above — the migration step
    # must apply even when the deploy gate is off, or the schema sits behind
    # the code. Only the deploy step is gated on who the deployer is.
    if:
      (github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'couriers-api'))
      || (github.event_name == 'push' && needs.changes.outputs.couriers-api == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The couriers database predates this service and the migrations moved
      # here with the prisma retirement; the app job no longer owns them.
      # `DIRECT_DATABASE_URL` is what apps/couriers-api/prisma.config.ts dials
      # for migrate, and `COURIERS_DATABASE_URL` is that database's own secret.
      # Prisma Postgres' pooled endpoint intermittently refuses the first
      # connection (P1001), which failed this job three times on 2026-08-15
      # while the surrounding runs passed unchanged. Retry before treating an
      # unreachable database as a broken migration.
      - name: Apply migrations
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @876/couriers-api exec prisma migrate deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=Migration attempt $attempt failed::Retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
            fi
          done
          echo "::error title=Migrations failed::prisma migrate deploy did not succeed after 3 attempts."
          exit 1
        env:
          DIRECT_DATABASE_URL: ${{ secrets.COURIERS_DIRECT_DATABASE_URL }}
      - name: Sync runtime database secret
        working-directory: apps/couriers-api
        run: |
          printf '%s' "$DATABASE_URL" |
            pnpm exec wrangler secret put DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-couriers-api
      - name: Deploy container Worker
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        working-directory: apps/couriers-api
        run: pnpm exec wrangler deploy
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-couriers-api

  billing-api:
    needs: changes
    if:
      (github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'billing-api'))
      || (github.event_name == 'push' && needs.changes.outputs.billing-api == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Adopt the Billing migration ledger
        run: pnpm --filter @876/billing-api run db:baseline
        env:
          BILLING_DIRECT_DATABASE_URL: ${{ secrets.BILLING_DIRECT_DATABASE_URL }}
      - name: Apply migrations
        run: pnpm --filter @876/billing-api run db:deploy
        env:
          BILLING_DIRECT_DATABASE_URL: ${{ secrets.BILLING_DIRECT_DATABASE_URL }}
      - name: Sync runtime database secret
        working-directory: apps/billing-api
        run: |
          printf '%s' "$BILLING_DATABASE_URL" |
            pnpm exec wrangler secret put BILLING_DATABASE_URL
        env:
          BILLING_DATABASE_URL: ${{ secrets.BILLING_DATABASE_URL }}
      # The validator side of the same shared key. Must equal what apps/api,
      # apps/billing and apps/console send, or it rejects them all 401. Synced
      # before the container redeploy that copies it into the running instance.
      - name: Sync the shared billing internal key
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        uses: ./.github/actions/sync-worker-secret
        with:
          app-directory: apps/billing-api
          secret-name: BILLING_INTERNAL_KEY
          secret: ${{ secrets.BILLING_INTERNAL_KEY }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-billing-api
      - name: Deploy container Worker
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        working-directory: apps/billing-api
        run: pnpm exec wrangler deploy
      - name: Verify production readiness
        run: pnpm check:worker-readiness 876-billing-api

  storage-api:
    needs: changes
    if: (github.event_name == 'push' && needs.changes.outputs.storage-api == 'true') || inputs.app == 'all' || inputs.app == 'storage-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/storage-api/requirements.txt
      - name: Install migration dependencies
        working-directory: apps/storage-api
        run: python -m pip install -r requirements.txt
      - name: Apply migrations
        working-directory: apps/storage-api
        run: python -m alembic upgrade head
        env:
          STORAGE_DATABASE_URL: ${{ secrets.STORAGE_DATABASE_URL }}
      - name: Sync runtime database secret
        working-directory: apps/storage-api
        run: |
          printf '%s' "$STORAGE_DATABASE_URL" |
            pnpm exec wrangler secret put STORAGE_DATABASE_URL
        env:
          STORAGE_DATABASE_URL: ${{ secrets.STORAGE_DATABASE_URL }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-storage-api
      - name: Deploy container Worker
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        working-directory: apps/storage-api
        run: pnpm exec wrangler deploy
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-storage-api

  # ── UI Workers ───────────────────────────────────────────────────────────

  console:
    needs: [changes, widgets-api, api]
    if: always() && !failure() && !cancelled() && ((github.event_name == 'push' && needs.changes.outputs.console == 'true') || inputs.app == 'all' || inputs.app == 'console')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm --filter @876/console exec prisma migrate deploy
        env:
          CONSOLE_DIRECT_DATABASE_URL: ${{ secrets.CONSOLE_DIRECT_DATABASE_URL }}
      - name: Sync the shared session cookie secret
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/console
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      # Console calls 876-billing-api admin with this shared key.
      - name: Sync the shared billing internal key
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        uses: ./.github/actions/sync-worker-secret
        with:
          app-directory: apps/console
          secret-name: BILLING_INTERNAL_KEY
          secret: ${{ secrets.BILLING_INTERNAL_KEY }}
      - name: Sync runtime database secret
        working-directory: apps/console
        run: |
          printf '%s' "$CONSOLE_DATABASE_URL" |
            pnpm exec wrangler secret put CONSOLE_DATABASE_URL
        env:
          CONSOLE_DATABASE_URL: ${{ secrets.CONSOLE_DATABASE_URL }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-console
      - name: Deploy
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm --filter @876/console run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_876_API_URL: ${{ vars.NEXT_PUBLIC_876_API_URL }}
          NEXT_PUBLIC_876_API_KEY: ${{ secrets.NEXT_PUBLIC_876_API_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-console

  billing:
    needs: [changes, widgets-api, api, billing-api]
    if: always() && !failure() && !cancelled() && ((github.event_name == 'push' && needs.changes.outputs.billing == 'true') || inputs.app == 'all' || inputs.app == 'billing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Sync the shared session cookie secret
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/billing
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      # The Billing app calls 876-billing-api admin with this shared key.
      - name: Sync the shared billing internal key
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        uses: ./.github/actions/sync-worker-secret
        with:
          app-directory: apps/billing
          secret-name: BILLING_INTERNAL_KEY
          secret: ${{ secrets.BILLING_INTERNAL_KEY }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-billing
      - name: Deploy
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm --filter @876/billing-app run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-billing

  # Invoice has no datastore of its own — its records live in the Billing data
  # plane — so on push there is nothing for this workflow to do unless it owns
  # push deployments.
  invoice:
    needs: [changes, api, billing-api]
    if: always() && !failure() && !cancelled()
      && ((github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'invoice'))
      || (github.event_name == 'push' && vars.DEPLOY_FROM_ACTIONS == 'true' && needs.changes.outputs.invoice == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A Worker nobody has deployed yet cannot take `wrangler secret put`, and
      # wrangler refuses a first deploy while a required secret is unset — so
      # the first deploy has to carry the secrets with it. Which of those two
      # paths applies is decided here rather than by the secret preflight,
      # which would otherwise report a never-deployed Worker as a failure.
      - name: Resolve Worker state
        id: worker
        run: |
          set +e
          node scripts/worker-exists.mjs 876-invoice
          case "$?" in
            0) echo "state=exists" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=missing" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Create the Worker with its secrets
        if: steps.worker.outputs.state == 'missing'
        env:
          API_INTERNAL_KEY: ${{ secrets.API_INTERNAL_KEY }}
          INVOICE_API_876_KEY: ${{ secrets.INVOICE_API_876_KEY }}
          SESSION_COOKIE_SECRET: ${{ secrets.SESSION_COOKIE_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          if [ -z "$API_INTERNAL_KEY" ] || [ -z "$INVOICE_API_876_KEY" ] || [ -z "$SESSION_COOKIE_SECRET" ]; then
            echo "::notice title=876-invoice not created::The Worker does not exist and one of API_INTERNAL_KEY, INVOICE_API_876_KEY, SESSION_COOKIE_SECRET is not configured as a repository secret. Add them, or run the first deploy manually with wrangler deploy --secrets-file. Skipping."
            exit 0
          fi
          umask 077
          secrets_file="$RUNNER_TEMP/876-invoice.secrets"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'API_INTERNAL_KEY=%s\n' "$API_INTERNAL_KEY"
            printf 'INVOICE_API_876_KEY=%s\n' "$INVOICE_API_876_KEY"
            printf 'SESSION_COOKIE_SECRET=%s\n' "$SESSION_COOKIE_SECRET"
          } > "$secrets_file"
          pnpm --filter @876/invoice-app run cf:build
          cd apps/invoice
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
      # A Worker that does not exist yet cannot take `wrangler secret put`; the
      # creation step above already carried the secret in that case.
      - name: Sync the shared session cookie secret
        if: steps.worker.outputs.state != 'missing'
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/invoice
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      - name: Verify runtime secrets
        if: steps.worker.outputs.state != 'missing'
        run: pnpm check:worker-secrets 876-invoice
      - name: Deploy
        if: steps.worker.outputs.state != 'missing'
        run: pnpm --filter @876/invoice-app run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-invoice

  couriers:
    needs: [changes, widgets-api, api]
    if: always() && !failure() && !cancelled() && ((github.event_name == 'push' && needs.changes.outputs.couriers == 'true') || inputs.app == 'all' || inputs.app == 'couriers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Sync the shared session cookie secret
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/couriers
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-couriers
      - name: Deploy
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm --filter @876/couriers-app run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-couriers

  # enterprise and app have no datastore, so on push there is nothing for this
  # workflow to do — Workers Builds owns them end to end.
  enterprise:
    needs: [changes, api]
    if: always() && !failure() && !cancelled()
      && ((github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'enterprise'))
      || (github.event_name == 'push' && vars.DEPLOY_FROM_ACTIONS == 'true' && needs.changes.outputs.enterprise == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Sync the shared session cookie secret
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/enterprise
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-enterprise
      - name: Deploy
        run: pnpm --filter @876/enterprise run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-enterprise

  app:
    needs: [changes, api]
    if: always() && !failure() && !cancelled()
      && ((github.event_name == 'workflow_dispatch' && (inputs.app == 'all' || inputs.app == 'app'))
      || (github.event_name == 'push' && vars.DEPLOY_FROM_ACTIONS == 'true' && needs.changes.outputs.app == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Sync the shared session cookie secret
        uses: ./.github/actions/sync-session-secret
        with:
          app-directory: apps/876
          secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      - name: Verify runtime secrets
        run: pnpm check:worker-secrets 876-app
      - name: Deploy
        run: pnpm --filter @876/app run deploy
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Verify production readiness
        if: (github.event_name == 'workflow_dispatch' || vars.DEPLOY_FROM_ACTIONS == 'true')
        run: pnpm check:worker-readiness 876-app
