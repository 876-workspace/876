name: PR 334 TanStack compatibility fix

on:
  push:
    branches:
      - chore/upgrade-all-packages
    paths:
      - .github/workflows/pr-334-tanstack-compat.yml

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Restore compatible TanStack Table major
        shell: bash
        run: |
          find . -name package.json \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 sed -i 's/"@tanstack\/react-table": "\^9\.1\.2"/"@tanstack\/react-table": "^8.21.3"/g'

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install metadata
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Commit compatibility fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.json' pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No TanStack dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): keep TanStack Table on v8"
          git push origin HEAD:chore/upgrade-all-packages
