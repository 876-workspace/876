name: API database baseline

# Runs `db:baseline` against an environment's database, on demand.
#
# The identity database predates Prisma, so its baseline migration has to be
# resolved as already-applied once per environment before `migrate deploy` can
# work. The deploy job does this automatically, but the first run of anything
# that writes to a production schema is worth doing deliberately and reading —
# hence a dispatchable job with a dry run that changes nothing.
#
# This deploys nothing. It only touches the `_prisma_migrations` bookkeeping.
#
# The target is `API_DATABASE_URL`. The unprefixed `DATABASE_URL` secret held a
# courier connection string, which is how identity DDL was aimed at another
# service's database; the dry run below now refuses outright when the target
# carries none of the identity tables.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reports the decision; apply resolves the baseline'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Report the decision (dry run)
        if: inputs.mode == 'dry-run'
        run: pnpm --filter @876/api run db:baseline -- --dry-run
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}

      - name: Resolve the baseline
        if: inputs.mode == 'apply'
        run: pnpm --filter @876/api run db:baseline
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}

      - name: Show migration status
        if: always()
        run: pnpm --filter @876/api exec prisma migrate status || true
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
